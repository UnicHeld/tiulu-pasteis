services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tiulu
      POSTGRES_USER: tiulu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiulu"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    command: ["node", "dist-server/server/migrate.js"]
    environment:
      DATABASE_URL: postgres://tiulu:${POSTGRES_PASSWORD}@db:5432/tiulu
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgres://tiulu:${POSTGRES_PASSWORD}@db:5432/tiulu
      APP_ORIGIN: ${APP_ORIGIN:?Defina APP_ORIGIN HTTPS}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
